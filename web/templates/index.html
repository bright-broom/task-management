<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="M2X タスク管理システム - 工場向けマルチテナント対応タスク管理">
    <meta name="theme-color" content="#3b82f6">
    <title>M2X タスク管理システム</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideIn: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                    },
                },
            },
        }
    </script>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
</head>

<body class="bg-gray-50 min-h-screen text-gray-900 antialiased">
    <!-- Skip Link for Accessibility -->
    <a href="#mainContent" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-blue-600 text-white px-4 py-2 rounded-lg z-50">
        メインコンテンツへスキップ
    </a>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Title -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm shadow-sm">
                        M2
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-900 leading-tight">M2X タスク管理</h1>
                        <p class="text-xs text-gray-500 hidden sm:block">工場向けタスク管理システム</p>
                    </div>
                </div>

                <!-- Tenant Selector -->
                <div class="flex items-center gap-3">
                    <label for="tenantSelect" class="text-sm font-medium text-gray-600 hidden sm:inline">
                        テナント
                    </label>
                    <div class="relative">
                        <select
                            id="tenantSelect"
                            class="appearance-none bg-white border border-gray-300 rounded-lg pl-3 pr-10 py-2 text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer shadow-sm hover:border-gray-400 transition-colors"
                            aria-label="テナント選択">
                            <option value="">読み込み中...</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-gray-200" aria-label="メインナビゲーション">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div
                id="tabButtons"
                class="flex gap-6 -mb-px overflow-x-auto scrollbar-hide"
                role="tablist"
                aria-label="コンテンツタブ">
                <!-- Tab buttons will be inserted here by JavaScript -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="mainContent" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Content will be inserted here by JavaScript -->
        <div class="flex items-center justify-center py-12">
            <div class="animate-pulse flex flex-col items-center gap-4">
                <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-gray-500 text-sm">読み込み中...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-center text-xs text-gray-400">
                M2X Task Management System v1.0
            </p>
        </div>
    </footer>

    <!-- Toast Container -->
    <div
        id="toastContainer"
        class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm"
        role="region"
        aria-label="通知"
        aria-live="polite">
        <!-- Toast messages will be inserted here -->
    </div>

    <!-- Loading Overlay (hidden by default) -->
    <div
        id="loadingOverlay"
        class="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-50 hidden"
        role="dialog"
        aria-modal="true"
        aria-label="読み込み中">
        <div class="bg-white rounded-xl p-6 shadow-xl flex items-center gap-4">
            <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-gray-700 font-medium">処理中...</span>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
