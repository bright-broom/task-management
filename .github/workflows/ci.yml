name: CI

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check formatting with Black
        run: black --check web/

      - name: Check import sorting with isort
        run: isort --check-only web/

      - name: Lint with flake8
        run: flake8 web/ --max-line-length=100 --ignore=E501,W503

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m2x_user
          POSTGRES_PASSWORD: m2x_password
          POSTGRES_DB: m2x_task_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt
          pip install pytest pytest-cov

      - name: Run database migrations
        env:
          PGHOST: localhost
          PGUSER: m2x_user
          PGPASSWORD: m2x_password
          PGDATABASE: m2x_task_management
        run: |
          psql -f db/migrations/001_create_tables.sql
          psql -f db/migrations/002_seed_data.sql

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://m2x_user:m2x_password@localhost:5432/m2x_task_management
        working-directory: web
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: web/coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          sleep 10

      - name: Health check
        run: |
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/api/tenants || exit 1

      - name: Stop services
        run: docker compose down

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r web/ -ll -ii

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r web/requirements.txt
          safety check || true  # Don't fail on known vulnerabilities in dev deps

  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI spec
        uses: char0n/swagger-editor-validate@v1
        with:
          definition-file: docs/openapi.yaml
