name: CI

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m2x_user
          POSTGRES_PASSWORD: m2x_password
          POSTGRES_DB: m2x_task_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt
          pip install pytest

      - name: Run database migrations
        env:
          PGHOST: localhost
          PGUSER: m2x_user
          PGPASSWORD: m2x_password
          PGDATABASE: m2x_task_management
        run: |
          psql -f db/migrations/001_create_tables.sql
          psql -f db/migrations/002_seed_data.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://m2x_user:m2x_password@localhost:5432/m2x_task_management
        working-directory: web
        run: pytest tests/ -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose up -d --build
          sleep 15

      - name: Health check
        run: |
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/api/tenants || exit 1

      - name: Stop services
        run: docker compose down
